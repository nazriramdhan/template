<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>template login page</title>
    <link rel="stylesheet" href="style-login.css">
    <link rel="icon" type="image" href="">
</head>

<body>
    <div class="container">
        <div class="box">
            <h1 class="logo">logo</h1>
            <form action="proses" method="post">
                <label for="name">nama</label>
                <input type="text" name="inputan-nama" id="name" required placeholder="nama">

                <label for="password">password</label>
                <input type="password" name="inputan-password" id="password" required placeholder="password">
                <a class="forgot" href="">forgot password?</a>
                <input class="submit" type="submit" value="login">
                <a class="sign" href="">sign in with</a>
                <div class="sign-logo">

                </div>
            </form>
        </div>
    </div>
</body>

</html>
